description = """
Profile-driven performance optimization workflow. Establishes baselines,
profiles hotspots, builds an opportunity matrix, implements optimizations
(Score >= 2.0 only), and proves behavior is unchanged via isomorphism proofs.
"""
formula = "optimize"
version = 1
contract = "graph.v2"
target_required = true

[metadata.gc.methodology]
allowed_drain_policies = ["separate"]
interaction_modes = ["autonomous", "headless"]
review_modes = ["report"]

[vars]
[vars.artifact_root]
description = "Directory where stage artifacts are written."
required = true

[vars.context_path]
description = "Optional source context bundle path."
default = ""

[vars.benchmark_command]
description = "Command to benchmark for baseline."
required = true

[vars.max_iterations]
description = "Maximum optimize/verify attempts."
default = "5"

[[steps]]
id = "prepare"
title = "Prepare optimization context"
metadata = { "gc.run_target" = "gc.run-operator" }
description_file = "../assets/workflows/optimize/prepare.md"

[[steps]]
id = "baseline"
title = "Establish performance baseline"
needs = ["prepare"]
metadata = { "gc.run_target" = "phases.performance-optimizer", "gc.build.artifact_schema" = "gc.build.report.v1", "gc.build.artifact_path_keys" = "gc.build.baseline_path" }
description_file = "../assets/workflows/optimize/baseline.md"

[[steps]]
id = "analyze"
title = "Profile and build opportunity matrix"
needs = ["baseline"]
metadata = { "gc.run_target" = "phases.performance-optimizer", "gc.build.artifact_schema" = "gc.build.report.v1", "gc.build.artifact_path_keys" = "gc.build.matrix_path" }
description_file = "../assets/workflows/optimize/analyze.md"

[[steps]]
id = "implement"
title = "Implement optimizations (Score >= 2.0 only)"
needs = ["analyze"]
metadata = { "gc.run_target" = "gc.implementation-worker" }
description_file = "../assets/workflows/optimize/implement.md"
expand = "do-work"
expand_vars = { implementation_target = "gc.implementation-worker" }

[[steps]]
id = "verify"
title = "Prove behavior unchanged (isomorphism + golden checksums)"
needs = ["implement"]
metadata = { "gc.run_target" = "phases.performance-optimizer", "gc.build.artifact_schema" = "gc.build.report.v1", "gc.build.artifact_path_keys" = "gc.build.verify_path" }
description_file = "../assets/workflows/optimize/verify.md"

[[steps]]
id = "finalize"
title = "Finalize optimization report"
needs = ["verify"]
metadata = { "gc.run_target" = "gc.run-operator", "gc.build.artifact_schema" = "gc.build.final-report.v1", "gc.build.artifact_path_keys" = "gc.build.final_report_path" }
description_file = "../assets/workflows/optimize/finalize.md"
